ble="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-settings"></use></svg><span>设置</span></a><a href="update-log.html"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-update-log"></use></svg><span>更新日志</span></a><a href="auth.html" id="auth-link"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-login"></use></svg><span>登录</span></a></div></details></div></nav><main id="main" class="page-shell settings-shell"><header class="page-header"><div><h1>设置</h1><p>让账本更贴合你的使用习惯。</p></div></header><div id="page-status" class="page-status" role="status" aria-live="polite"></div><div class="panel settings-card"><section class="settings-section"><div class="section-heading"><div><h2>账本设置</h2><p>用于计算余额和本月预算。</p></div></div><div class="field-grid"><div class="input-group"><label for="initial-funds"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-wallet"></use></svg>初始资金</label><input id="initial-funds" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div><div class="input-group"><label for="budget"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-budget"></use></svg>月度预算</label><input id="budget" type="number" min="0" step="0.01" inputmode="decimal" placeholder="暂不设置"></div></div></section><section class="settings-section"><div class="section-heading"><div><h2>显示偏好</h2><p>货币只影响显示，不进行汇率换算。</p></div></div><div class="field-grid"><div class="input-group"><label for="currency"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-amount"></use></svg>货币</label><select id="currency"><option value="CNY">CNY</option><option value="SGD">SGD</option><option value="HKD">HKD</option><option value="USD">USD</option><option value="JPY">JPY</option></select></div><div class="input-group"><label for="theme"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-theme"></use></svg>外观</label><select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="github">GitHub 白</option><option value="github-dark">GitHub 黑</option><option value="midnight">午夜蓝</option><option value="lavender">薰衣草</option></select></div></div></section><div class="form-actions"><button id="save-settings" onclick="save设置()" class="button button-primary"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-save"></use></svg>保存设置</button></div></div><section class="panel settings-section data-panel"><div class="section-heading"><div><h2>数据管理</h2><p>重要操作前，建议先导出一份备份。</p></div></div><div class="action-row"><div><h3>导出全部账单</h3><p>将当前账号的账单保存为 JSON 文件。</p></div><button onclick="exportAllExpenses()" class="button button-secondary"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-export"></use></svg>导出账单</button></div><div class="action-row"><div><h3>清理重复账单</h3><p>按相同字段和 60 秒窗口识别；相同消费也可能是真实交易。</p></div><button onclick="cleanupDuplicateRecords()" class="button button-secondary"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-cleanup"></use></svg>清理重复</button></div></section><section class="panel danger-panel"><div><h2>清空全部数据</h2><p>删除当前账号的全部账单与设置，请先确认已保存备份。</p></div><button onclick="resetData()" class="button button-danger"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-delete"></use></svg>清空数据</button></section><div id="toast" class="toast" role="status" aria-live="polite"></div></main><script>async function cleanupDuplicateRecords(){if(!confirm("仅删除字段完全相同且在60秒内重复生成的账单，并保留最早的一条。确定继续吗？"))return;try{const r=await cleanupDuplicateExpenses();showToast(r.count?"已清理 "+r.count+" 条重复账单。":"未发现符合条件的重复账单。");}catch(e){console.error(e);showToast("清理失败，请稍后重试。");}}</script><footer class="footer"><span>Lily Accounting</span><a href="update-log.html">更新日志</a></footer></body></html>
