<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>设置</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
  <script src="data.js" defer></script>
</head>
<body class="settings-page">
  <nav>
    <div class="brand"><img src="logo.png" alt="Lily Accounting logo" />Lily Accounting</div>
    <div>
      <a href="index.html">首页</a>
      <a href="add.html">记一笔</a>
      <a href="history.html">账单记录</a>
      <a href="analytics.html">数据分析</a>
      <a href="settings.html">设置</a>
    <a href="auth.html" id="auth-link">登录</a>
    </div>
  </nav>

  <h1 class="page-title">⚙️ 设置</h1>

  <div class="settings-card">
    <div class="input-group">
      <label for="initial-funds">初始资金</label>
      <input type="number" id="initial-funds" min="0" step="0.01" placeholder="例如：10000" />
    </div>

    <div class="input-group">
      <label for="budget">月度预算</label>
      <input type="number" id="budget" placeholder="输入月度预算" />
    </div>

    <div class="input-group">
      <label for="currency">货币</label>
      <select id="currency">
        <option value="CNY">¥ CNY</option>
        <option value="INR">₹ INR</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
      </select>
    </div>

    <div class="input-group">
      <label for="theme">外观</label>
      <select id="theme">
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </div>

    <button onclick="save设置()" class="animated-btn">💾 Save 设置</button>
    <button onclick="resetData()" class="animated-btn danger">🗑️ 清空全部数据</button>
    <button onclick="exportAllExpenses()" class="animated-btn">⬇️ 导出全部账单</button>
  </div>

  <div id="toast" class="toast">✅ 设置 Saved!</div>

  <footer class="footer">© Lily Accounting</footer>
</body>
</html>
