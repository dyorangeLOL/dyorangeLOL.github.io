<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.png"><title>登录 · Lily Accounting</title><link rel="stylesheet" href="style.css?v=20261016-layout2">

<body class="auth-page"><script>try{var t=localStorage.getItem("lily-theme");if(["light","dark","github","github-dark","midnight","lavender"].includes(t)){document.body.classList.add("theme-"+t);document.body.classList.toggle("dark",["dark","midnight","github-dark"].includes(t));}}catch(e){}</script><a class="skip-link" href="#main">跳到主要内容</a><main id="main" class="auth-shell"><a href="index.html" class="auth-brand"><img src="logo.png" width="40" height="40" alt=""><span>Lily Accounting</span></a><section class="panel auth-card"><header class="auth-heading"><h1>登录账号</h1><p>登录后，继续记录你的日常收支。</p></header><form id="auth-form"><div class="input-group"><label for="email"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-email"></use></svg>邮箱</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="input-group"><label for="password"><svg class="lily-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/icons/lily-icons.svg?v=20261014-icons#icon-lock"></use></svg>密码</label><input id="password" type="password" placeholder="至少 6 位" autocomplete="current-password" minlength="6" required></div><div class="auth-actions"><button id="login-button" type="button" class="button button-primary">登录</button><button id="signup-button" type="button" class="button button-secondary">注册新账户</button></div><p id="auth-status" class="auth-status" role="status" aria-live="polite"></p></form></section><p class="auth-note">为每一笔收支，留一份清楚的记录。</p></main><footer class="footer"><span>Lily Accounting</span><a href="update-log.html">更新日志</a></footer></body></html>
