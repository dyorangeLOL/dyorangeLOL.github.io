<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="logo.png"><title>Lily Accounting - 登录</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><img src="logo.png" alt="Lily Accounting" class="auth-logo"><h1>登录 Lily Accounting</h1><p class="auth-subtitle">登录后，你的账单只对你可见。</p><form id="auth-form"><div class="input-group"><label for="email">邮箱</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="input-group"><label for="password">密码</label><input id="password" type="password" placeholder="至少 6 位" required></div><div class="auth-actions"><button id="login-button" type="button">登录</button><button id="signup-button" type="button" class="secondary-btn">注册新账户</button></div><p id="auth-status" class="auth-status"></p></form></main></body></html>
