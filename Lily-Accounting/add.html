<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>Lily Accounting - 记一笔</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n  <script src="auth.js" defer></script>\n  <script src="data.js" defer></script>\n  <script src="script.js" defer></script>
  <script src="data.js" defer></script>
</head>
<body class="add-page">
  <nav>
    <div class="brand"><img src="logo.png" alt="Lily Accounting logo" />Lily Accounting</div>
    <div>
      <a href="index.html">首页</a>
      <a href="add.html">记一笔</a>
      <a href="history.html">账单记录</a>
      <a href="analytics.html">数据分析</a>
      <a href="settings.html">设置</a>\n    <a href="auth.html" id="auth-link">登录</a>
    </div>
  </nav>

  <h1 class="page-title">➕ 新增账单</h1>

  <div class="glass-form">
    <form id="expense-form">
      <div class="input-group">
        <label for="desc">📝 账单备注</label>
        <input type="text" id="desc" placeholder="例如：超市购物" required />
      </div>

      <div class="input-group">
        <label for="amount">💰 金额</label>
        <input type="number" id="amount" placeholder="例如：1200.50" min="0" step="0.01" inputmode="decimal" required />
      </div>

      <div class="input-group">
        <label for="type">🔄 类型</label>
        <select id="type" required>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>

      <div class="input-group">
        <label for="category">📂 分类</label>
        <select id="category" required>
          <option value="">请选择分类</option>
          <option value="Food">🍔 餐饮</option>
          <option value="Transport">🚌 交通</option>
          <option value="Education">🎓 学习</option>
          <option value="Tech">💻 数码</option>
          <option value="Housing">🏠 住房</option>
          <option value="Shopping">🛍️ 购物</option>
          <option value="Entertainment">🎮 娱乐</option>
          <option value="Medical">🏥 医疗</option>
          <option value="Bills">💡 水电网费</option>
          <option value="Salary">💼 工资</option>
          <option value="Bonus">🎁 奖金</option>
          <option value="Other">📦 其他</option>
        </select>
      </div>

      <div class="input-group">
        <label for="date">📅 日期</label>
        <input type="date" id="date" required />
      </div>

      <button type="submit" class="animated-btn">记一笔</button>
    </form>
  </div>

 <footer class="footer">© Lily Accounting</footer>
</body>
</html>
