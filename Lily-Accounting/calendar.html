<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lily Accounting - 支出日历</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="calendar.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script><script src="data.js" defer></script><script src="calendar.js" defer></script></head>
<body><script>try{const t=localStorage.getItem("lily-theme");if(["light","dark","github","midnight","lavender"].includes(t)){document.body.classList.add("theme-"+t);document.body.classList.toggle("dark",t==="dark"||t==="midnight");}}catch(e){}</script><nav><div class="brand"><img src="logo.png" alt="Lily Accounting logo">Lily Accounting</div><div><a href="index.html">首页</a><a href="add.html">记一笔</a><a href="history.html">账单记录</a><a href="calendar.html" aria-current="page">支出日历</a><a href="analytics.html">数据分析</a><a href="settings.html">设置</a><a href="update-log.html">更新日志</a><a href="auth.html" id="auth-link">登录</a></div></nav>
<main class="calendar-shell"><h1 class="page-title">📅 支出日历</h1><section class="calendar-panel" aria-label="月度支出日历"><div class="calendar-toolbar"><button id="previous-month" aria-label="上个月" disabled>‹</button><h2 id="calendar-month">正在加载…</h2><button id="next-month" aria-label="下个月" disabled>›</button><button id="current-month" disabled>回到本月</button></div><p id="month-spending" class="calendar-summary"></p><p class="calendar-note">按账单日期汇总支出，不计收入。点击日期查看明细。金额使用设置中的货币显示，不进行汇率换算。</p><p id="calendar-status" role="status">正在读取账单…</p><div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar-grid" class="calendar-grid"></div></section><section class="calendar-detail" aria-live="polite"><h2 id="day-title">当天支出明细</h2><div id="day-expenses"></div></section></main><footer class="footer">© Lily Accounting</footer></body></html>
